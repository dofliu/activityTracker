key_metrics: "全系統已完成實測驗證：1. 徹底刪除 TestApp 測試列，Web UI 與後端實作動態紅黃綠燈（逾時 3 小時標紅、30 分鐘內標綠），杜絕假健康；2. 徹底清除所有佔位字串與 orphan 紀錄，真實 AI 結論配對率達 95.6% (1,944/2,034 筆，Codex 97.9%、Antigravity 94.8%、Claude Code 88.0%)；3. 實作論文 Top-Down Canonical Resolver，將 81 個碎片化子目錄收斂為清晰論文主專案；4. 排除 activityTracker 自身日誌干擾，恢復程式碼與論文雙軌即時監控；5. Telegram 預設啟用並支援晨報 dry-run 完整格式。"
