name_zh: OmniContext 個人全景活動追蹤系統
category: personal_tools
progress: 99
progress_basis: "依 P0-P8 加權里程碑估計；不是 release readiness 百分比"
status: active_hardening
release_ready: false
last_updated: "2026-09-04"
current_phase: "ADR-008 P5-R1～R5 全階段完成（秘書執行器／Telegram inline 批准／L0 排程任務，全部預設關閉）+ P4.3 Repo Onboarding + 儀表板資訊架構重整與配色主題 + RAG 檢索移至常駐 worker（ADR-009 Addendum）+ Repo 同步全覽／批次／秘書同步報告（ADR-011 Addendum B）+ 儀表板資訊整併與秘書每日包（早晨包／活躍專案 Handoff／為什麼是現在）+ 秘書記憶區／Telegram 對話／多通道推播／問候卡（ADR-012～014）+ 本機行事曆採集（ADR-015）；進入等待使用者側 live 收據階段"
next_milestone: "取得使用者側 live 收據（全天 coverage ledger、Telegram 設定＋inline 批准、L2 draft→apply、P4.3 onboarding 一輪實操）後重評 release_ready；功能面依需求擴充 template 或評估 P4 其餘來源"
planned_features:
  - id: FEATURE-001
    name: "每日主要介面使用時間與里程碑教練"
    stage: implemented_alpha
    priority: should_have
    scope: "統計主要介面的 foreground active time，提供可配置每日里程碑、鼓勵與休息提醒"
    trust_boundary: "不得將前景時間宣稱為生產力；coverage 不完整時顯示 partial/unavailable；預設不送 cloud LLM"
    specification: "docs/FEATURE-001-daily-interface-usage-milestone-coach.md"
  - id: FEATURE-002
    name: "跨 AI、應用與 Repository 的個人工作脈絡層"
    stage: implemented_alpha
    priority: must_have
    scope: "將多 AI sessions、browser events、local files、Git/GitHub、foreground activity 與 Open Loops 歸入 canonical project timeline，產生 provider-neutral Context Handoff"
    trust_boundary: "不得宣稱完整匯入所有 provider history；每個來源保留 provenance、response status、embedding input mode 與 coverage；similarity 不代表真實性"
    specification: "docs/PRODUCT_POSITIONING.md"
  - id: FEATURE-003
    name: "可追溯的 Proposal-only 主動秘書（含選用 LLM 註解層）"
    stage: implemented_alpha_with_llm_advisor
    priority: should_have
    scope: "從本機 Project State、actionable Open Loops 與 Extension diagnostics 產生唯讀下一步建議；P5-R1 可選由 LLM（預設本機 Ollama）附加 annotate-only 判斷提示與今日 summary"
    trust_boundary: "規則引擎不呼叫 LLM、不寫資料庫、不執行 command、不提供批准執行；LLM 註解層預設關閉、只能註解既有 proposal_id、prompt 僅含白名單欄位、cloud 使用時 cloud_llm_used 如實標示、失敗回退 deterministic"
    specification: "docs/ADR-007-proposal-only-secretary.md + docs/ADR-008-gated-agent-executor.md（P5-R1）"
  - id: FEATURE-004
    name: "DeskRAG 本地知識庫與文件智慧問答系統"
    stage: implemented_hardened
    priority: must_have
    scope: "解析 PDF/Office/Text，滑動窗口切分，FastEmbed+ChromaDB 向量庫與 Jieba+BM25 關鍵字索引，Hybrid RRF 檢索，多模型 SSE 串流問答與總管定位；大型索引以受控 worker 執行"
    trust_boundary: "來源檔案與對話不因索引管理被刪除；主服務只讀 job receipt，不直接載入大型 Chroma/BM25（檢索亦由常駐 retrieval worker 子程序執行，主程序不 import chromadb/fastembed/rank_bm25）；向量與空間數值未經 worker 驗證時顯示 unverified；檢索 worker 狀態只描述程序狀態與載入計數"
    specification: "docs/ADR-009-deskrag-worker-index-lifecycle.md"
  - id: FEATURE-005
    name: "採集器局部容錯隔離、自我修復守護與系統生命週期維護"
    stage: implemented_integrated
    priority: must_have
    scope: "Watchdog Observer 自動重啟、Git 損壞倉庫隔離、Agent 多來源熔斷、系統自動 WAL Checkpoint 與線上輪替備份"
    trust_boundary: "單一採集器或單一倉庫損毀不得導致全系統崩潰；自動恢復收據保留於本機診斷端點"
    specification: "ROADMAP.md（P8 系統基礎穩健化工程章節）"
  - id: FEATURE-006
    name: "Web 儀表板系統健康燈號與一鍵維護面板"
    stage: implemented_integrated
    priority: must_have
    scope: "在 Web 前端呈現 5 大採集器即時狀態矩陣、損壞倉庫隔離警告、一鍵主動自我修復、立即 WAL Checkpoint、完整資料庫維護與即時終端輸出"
    trust_boundary: "所有操作透明輸出結構化 JSON 收據；狀態即時從後端探測並呈現真實健康度"
    specification: "ROADMAP.md（P8 系統基礎穩健化工程章節）"
  - id: FEATURE-007
    name: "可驗證背景 Agent／CLI 任務時間"
    stage: implemented_alpha_live_codex_receipt
    priority: should_have
    scope: "以 Claude Code、Claude Desktop local-agent、Codex 的成對 local start/final receipt 統計背景執行時間，並獨立呈現"
    trust_boundary: "不可與 WindowEvent 前景時間、AI turns、里程碑或生產力混算；generic Terminal、cloud-only、start-only 與異常 duration 一律不補值"
    specification: "docs/ADR-010-verified-background-agent-task-time.md"
  - id: FEATURE-008
    name: "受控本機 Git Repository 同步中心（含全覽與批次）"
    stage: implemented_alpha
    priority: should_have
    scope: "在使用者明示設定的 Git roots 下顯示本機 branch、cached ahead/behind、worktree 狀態與上次 fetch 時間；逐一確認 fetch、fast-forward pull、staged-only commit、push；全覽表格、一鍵全部 fetch、清單確認式批次 pull/push；小秘書 L0 每日同步報告與批准式 L1 fast-forward pull"
    trust_boundary: "狀態比較僅為 cached local remote-tracking ref（每筆附 last_fetch_at）；無排程自動同步、無 git add、無 force push；pull/push 需 clean worktree 且無分歧且執行前在 lock 內重檢；批次只對使用者確認過的清單執行、批次 push 預設關閉；秘書報告唯讀不連網、pull 需批准、push 不代辦；不接受 dashboard 傳入任意本機路徑"
    specification: "docs/ADR-011-safe-local-repository-sync.md"
  - id: FEATURE-009
    name: "Repo Onboarding／Reconciliation"
    stage: implemented_alpha
    priority: should_have
    scope: "比對使用者設定的本機 roots 與 GitHub metadata，處理一般資料夾、未設定 remote 的 Git repo、以及尚未 clone 的雲端 repo；所有 init、remote、create、clone 都採單一 repo 的確認式流程"
    trust_boundary: "不得由同名自動配對、不得自動初始化或發布資料夾、不得覆寫非空目錄、不得批次 create/clone、不得 force reset/push；任何遠端建立或 clone 均需使用者選定路徑與明確確認"
    specification: "docs/ADR-011-safe-local-repository-sync.md"
