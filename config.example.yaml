server:
  host: 127.0.0.1
  port: 8765
  log_level: info
security:
  allowed_origins:
  - http://127.0.0.1:8765
  - http://localhost:8765
  allow_remote_clients: false
  browser_extension_ingest_token_env: OMNICONTEXT_INGEST_TOKEN
  browser_extension_ingest_token: ''
database:
  db_path: omni_context.db
data_lifecycle:
  backups_dir: ~/OmniContext/backups
  backup_retention_days: 30
  auto_backup_on_start: false
  auto_backup_before_migration: true
project_resolution:
  # 專案根目錄；Project State 與 Context Handoff 只在這些 roots 下找同名專案。
  # 留空則退回 watchers 的 watch_directories 與 repositories。
  search_roots: []
  # 本專案根目錄（供「Agent Development」卡片定位）；留空自動推導。
  self_project_path: ""
watchers:
  file_watcher:
    enabled: true
    watch_directories: []
    extensions:
    - .tex
    - .docx
    - .md
    - .pdf
    - .py
    # 預設黑名單（node_modules／.git／__pycache__／site-packages／.venv／logs／*.log…）
    # 已內建於 watchers/file_watcher.py::DEFAULT_IGNORES；這裡只列**額外**要忽略的。
    ignore_patterns:
    - '**/.*'
  git_watcher:
    enabled: true
    repositories: []
    scan_interval_seconds: 300
  # ADR-015 本機行事曆（唯讀）：把 .ics 檔或含 .ics 的資料夾加進 paths；沒有路徑＝停用。
  # 只讀時間／標題／地點／狀態；DESCRIPTION、與會者、連結一律不落地，不連任何雲端 API。
  calendar_watcher:
    enabled: true
    paths: []
    scan_interval_seconds: 900
    horizon_days: 30        # 重複行程展開到未來幾天（另含過去 7 天供回顧）
    store_titles: true      # false → 只留時間，連標題與地點都不存
repository_sync:
  # 與 git_watcher 共用明示設定的 repository roots。沒有排程自動 fetch/pull/commit/push；
  # 單一動作由 Dashboard 個別確認，批次 pull/push 需先列清單並確認（執行前仍重檢）。
  batch:
    allow_push: false       # 批次 push 會發佈 commit，預設關閉；單一 repo 的 Push 不受影響
    max_repositories: 50
  command_timeout_seconds: 30
  status_timeout_seconds: 5
  status_parallelism: 8
  max_repositories: 80
  dashboard_recent_limit: 10
  window_watcher:
    enabled: true
    heartbeat_minutes: 5
    interval_seconds: 5
    # 前景 probe 連續不可用超過此秒數時 runtime 顯示 degraded（鎖定畫面也可能觸發）。
    probe_degraded_after_seconds: 30
    idle_threshold_seconds: 180
  agent_log_watcher:
    enabled: true
    antigravity_logs_path: ~/.gemini/antigravity/brain
    claude_code_logs_path: ~/.claude
    # 留空時依 Windows/macOS/Linux 自動偵測 Claude Desktop local-agent-mode-sessions
    # claude_desktop_logs_path: C:/Users/you/AppData/Roaming/Claude/local-agent-mode-sessions
    claude_desktop_initial_lookback_days: 7
    claude_code: true
    claude_desktop: true
    codex: true
    antigravity: true
  browser:
    gemini: true
    chatgpt: true
    claude_web: true
    heartbeat_stale_minutes: 5
usage_tracking:
  enabled: true
  # P2.6 coverage ledger：記錄視窗採集器實際被觀測運作的時間段；當日覆蓋率達
  # full_coverage_ratio 時 usage coverage 才顯示 observed。
  coverage:
    heartbeat_interval_seconds: 300
    max_gap_seconds: 900
    full_coverage_ratio: 0.95
  goal_label: AI 協作
  goal_interfaces:
  - Claude Code
  - Claude
  - Codex
  - ChatGPT
  - Gemini
  - Antigravity
  daily_goal_minutes: 360
  milestones_minutes:
  - 120
  - 240
  - 360
  max_interval_seconds: 3600
  # 介面辨識規則（app/title 關鍵字）預設在 core/usage_analytics.py::DEFAULT_INTERFACE_RULES；
  # 要自訂就在這裡寫一份完整的 interface_rules 清單覆蓋它。
  notifications:
    enabled: false
    tone: encouraging
    quiet_hours_start: '22:00'
    quiet_hours_end: '08:00'
    cooldown_minutes: 60
    check_interval_minutes: 15
background_task_tracking:
  # 與前景時間分開；只接受本機 session 的 prompt start + explicit final receipt。
  enabled: true
  platforms: [claude_code, claude_desktop, codex]
  # 超過上限的來源 timestamp 視為不可信，不計入背景時間。
  max_task_duration_seconds: 28800
synthesizer:
  schedule:
    enabled: false
    time: '23:30'
  periodic_checkpoint:
    enabled: true
    interval_hours: 2
  # 兩層增量摘要：checkpoint 順帶用本機模型把該時段壓成 ≤100 字微摘要（map，零 API
  # 成本），日報只讀微摘要＋統計（reduce）。微摘要缺漏時自動回退原始節錄。
  micro_summary:
    enabled: true
    provider: ollama
    timeout_seconds: 90
  daily_from_micro: true
  # 日報 prompt 總長硬上限（字元）；用 Ollama 產日報時建議降到 60000。
  max_prompt_chars: 180000
  provider: ollama
  gemini:
    model: gemini-3.7-flash
    api_key_env: GEMINI_API_KEY
  anthropic:
    model: claude-3-5-sonnet-20241022
    api_key_env: ANTHROPIC_API_KEY
  openai:
    model: gpt-4o
    api_key_env: OPENAI_API_KEY
  ollama:
    base_url: http://localhost:11434
    model: llama3.1:8b

semantic_index:
  enabled: true
  provider: ollama
  base_url: http://127.0.0.1:11434
  embedding_model: bge-m3:latest
  batch_size: 8
  max_document_chars: 6000
  embedding_input_chars: 3000
  default_top_k: 6
  allow_remote: false

context_memory:
  # Session 是 derived temporal grouping，不寫回原始事件，也不代表實際工時或專注度。
  recent_hours: 72
  session_gap_minutes: 45
  max_sessions: 8
  # 0.50 是 bge-m3 ＋ 本機語料的實測起點，不是通用真實性門檻。
  related_threshold: 0.50

# ADR-012 小秘書記憶區：使用者筆記／偏好／決定＋秘書自己的觀察，是對話回答與
# 主動提案的固定參考來源。全部本機；不存 prompt／response 原文。
secretary_memory:
  enabled: true
  # 每次對話注入「今日狀態＋top 提案＋最近筆記」（有字數上限、附收據）。
  chat_context:
    enabled: true
    max_chars: 2500
  # 秘書觀察超過這個天數就不再注入對話；觀察永遠可一鍵刪除。
  observation_ttl_days: 14

# ADR-022 會議秘書：把會後逐字稿變成可回溯的紀錄。**不錄音、不讀會議軟體視窗、
# 不連 Teams／Graph API**——只等你把匯出的逐字稿放進 transcript_dir；沒設路徑＝停用。
meetings:
  transcript_dir: ""        # 例：C:/Users/you/OneDrive/Recordings；支援 .vtt/.docx/.txt/.md
  # **預設 ollama＝全本機**：逐字稿裡有其他與會者的發言，改成雲端 provider 就等於
  # 把他們的話送到那家供應商（觀察卡與設定頁會明白寫出來）。原文一律不落地。
  provider: ollama
  timeout_seconds: 120

# 小秘書：只產生唯讀提案，不保存、不執行。
# 引擎參數（活躍天數門檻、加權、視窗長度、提案數上限…）是**程式常數**，2026-09-16
# 起不再列在這裡——預設值見 core/{proactive_secretary,activity_patterns,docs_freshness,
# weekly_review,activity_digest,secretary_profile}.py 的 DEFAULT_*。真要改仍可在此
# 覆寫同名鍵，但那是調參，不是設定。
proactive_secretary:
  enabled: true
  # 每日工作誌（ADR-012 Addendum A）：把當天活動與時段微摘要 reduce 成一則記憶區
  # 觀察。唯讀、不呼叫 LLM、不新增資料類別；寫出的觀察可刪、會隨 TTL 過期。
  daily_digest:
    enabled: true
  # 模式感知提案（ADR-017）：用（專案 × 日）的活動計數注意到習慣（沒有每日排程、
  # 上週活躍這週歸零…）。只算已結束的日子、不讀 prompt 內容、不推測意圖。
  patterns:
    enabled: true
  # 文件落後程式（ADR-021）：文件檔最後異動後又累積了幾個 commit。只比時間與數量、
  # 不判斷文件內容；沒有文件異動紀錄的專案一律不提。
  docs_freshness:
    enabled: true
  # 每週回顧（ADR-020）：說的 vs 做的。上一個完整週各專案活躍幾天，對照宣告的優先。
  weekly_review:
    enabled: true
  # 01 首頁「小秘書的話」問候卡：今天／近兩小時做了什麼（只數採集器看到的活動）
  # ＋一句規則挑選的鼓勵語。llm.enabled 開啟時用 llm_advisor 的 provider 潤飾語氣，
  # 輸出裡出現統計以外的數字會整段丟掉、退回規則版（不得新增事實）。
  greeting:
    display_name: ''
    in_morning_briefing: true   # 晨報（Telegram／LINE／桌面）開頭也帶這段話
    llm:
      enabled: false
  # P5-R1 LLM advisory（預設關閉）：只能為既有建議附加唯讀註解與排序提示，不能
  # 新增/刪除/執行任何項目；失敗自動回退純規則結果。provider 選 ollama 為全本機；
  # 選雲端供應商代表同意將建議的非敏感欄位送往該供應商。
  llm_advisor:
    enabled: false
    provider: ollama
  # P5-R2 gated executor（預設關閉；ADR-008）：啟用後可在您逐項批准下代辦白名單
  # 動作（產 Handoff、repo fetch、open loop 標 stale）。只接受 proposal_id，動作由
  # server 白名單 template 決定；每次批准需 execution token，每次執行留 audit receipt。
  # 2026-09-16（ADR-008 Addendum D6）起，自訂排程任務（只能排 L0 唯讀 template）
  # 跟著這個總開關——任務本來就要您親手建立，建立本身就需要 execution token。
  executor:
    enabled: false
    # P5-R3 L2 dispatcher（獨立開關，預設關閉）：批准後另需回填 server 產生的一次性
    # 6 碼確認碼；同一 template 有冷卻時間。啟用後秘書可調度本機 agent CLI（argv
    # 白名單、禁 shell、cwd 限已探索 repo、環境變數 allowlist 重建——不轉發任何 API
    # key）。注意：CLI 會消耗您本機 Claude Code / Codex 的訂閱或 API 額度。
    l2:
      enabled: false
      confirm_ttl_seconds: 300
      cooldown_seconds: 600
      # 第三開關（ADR-008 Addendum）：允許 agent 依「已批准的 draft 計畫」實際修改該
      # 專案 repo 內檔案。dispatch 前 worktree 必須乾淨；agent 永不 commit/push——
      # 改動留在 worktree 供您 git diff 檢視，git checkout . 可整批還原。
      allow_write: false
    # P5-R4b Telegram inline 批准（預設關閉）：晨報／晚間交接附「✅ 批准」按鈕，在外
    # 一鍵批准 L0/L1（L2 一律回儀表板走確認碼）。通道需先在儀表板以 execution token
    # 解鎖（arm），armed 只存記憶體、有 TTL、重啟即失效；只處理綁定 chat id 的回呼。
    # 手機端 `/arm <6 位數碼>` 跟著這個開關（碼由儀表板簽發、5 分鐘失效、用過即銷毀）。
    telegram_approvals:
      enabled: false
      arm_ttl_hours: 24
      max_actions_per_push: 4
      arm_code_ttl_seconds: 300
    agent_cli:
      binary: claude          # 或 codex
      args: ['-p', '{prompt}']  # codex 範例：['exec', '{prompt}']
      timeout_seconds: 240
      # 寫入模式參數（allow_write 用）；不設定時依 binary 採預設：
      #   claude → ['-p', '{prompt}', '--permission-mode', 'acceptEdits']
      #   codex  → ['exec', '--full-auto', '{prompt}']
      # write_args: [...]
      write_timeout_seconds: 600

notifiers:
  desktop:
    enabled: true
    morning_briefing_time: '08:30'
    evening_summary_time: '22:00'
    stagnation_days: 5
    launch_url: http://127.0.0.1:8765
  telegram:
    # 建議在儀表板「設定 → Telegram 通知」完成設定：貼 bot token → 偵測 chat id →
    # 即時連線測試（getMe＋實發測試訊息）→ 通過才寫入此檔。環境變數優先於此處的值
    # 且不會被複製進檔案；Web API 讀取設定時 bot_token / chat_id 一律遮蔽。
    enabled: false
    bot_token_env: TELEGRAM_BOT_TOKEN
    chat_id_env: TELEGRAM_CHAT_ID
    bot_token: ''
    chat_id: ''
    morning_briefing_time: 09:00
    evening_summary_time: '23:30'
    # ADR-013 小秘書對話（預設關閉）：在綁定 chat 直接打字就是提問，走與儀表板交辦框
    # 同一條管線；「記下來：…／偏好：…／決定：…」直接寫記憶區不送 LLM。
    # 注意：這是唯一會把「你的提問與秘書的回答」送出本機的通道——內容會經過 Telegram
    # 伺服器（引用只送檔名）；provider 選雲端供應商時內容另會送往該供應商。
    chat:
      enabled: false
      provider: ''        # 空＝沿用 rag.active_provider
      model: ''           # 空＝沿用該 provider 的預設模型
      enable_rag: true
      max_question_chars: 1000
  # ADR-014 LINE 推播（預設關閉）。**只能推播**：要接收訊息必須由 LINE 平台 webhook
  # POST 到公開 HTTPS 網址，那會打破 loopback-only 邊界（ADR-001）——因此提問與批准
  # 仍走 Telegram。LINE 官方帳號免費方案有每月推播則數上限。
  # to 要填 userId（U 開頭長字串），不是 LINE ID（@xxxx）；取得方式見 USAGE。
  line:
    enabled: false
    access_token_env: LINE_CHANNEL_ACCESS_TOKEN
    to_env: LINE_TO_ID
    access_token: ''
    to: ''
exporters:
  daily_brief:
    enabled: true
    output_dir: ~/OmniContext
    inject_into: ''
  reports_dir: reports
  checkpoints_dir: logs/checkpoints
  obsidian:
    enabled: false
    vault_daily_notes_dir: ~/Documents/ObsidianVault/DailyNotes
integrations:
  github:
    enabled: true
    token: ''
    token_env: GITHUB_TOKEN

rag:
  enabled: true
  chroma_dir: data/chroma
  bm25_path: data/bm25_index.pkl
  embedding_provider: fastembed
  embedding_model: BAAI/bge-small-zh-v1.5
  default_top_k: 6
  default_hybrid_alpha: 0.65
  chunk_size: 800
  chunk_overlap: 150
  active_provider: ollama
  active_model: llama3.2:latest
  system_prompt: 你是專業的本地知識庫與工作脈絡 AI 助手。請根據檢索到的文件內容精準回答。
  indexing:
    # 每次工作有明確邊界；大型資料夾請分批執行，不會阻塞主服務。
    max_files_per_run: 500
    throttle_ms: 25
    max_file_size_mb: 50
    vector_batch_size: 32
  retrieval:
    # worker（預設）：檢索在常駐子程序執行，主服務不載入 Chroma／BM25／embedding；
    # 逾時即終止子程序、下次提問自動重啟。in_process：舊行為，在主服務內檢索。
    mode: worker
    # 啟動後若已有索引，就在背景把索引載進 worker，第一次提問不必等載入。
    # 沒有索引時不會啟動任何子程序（避免空裝機觸發 embedding 模型下載）。
    warmup_on_start: true
