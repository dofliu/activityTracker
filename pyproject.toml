[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnicontext"
dynamic = ["version"]
description = "Local-first personal context and activity tracker"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Juihung Liu"}]
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.28.0",
  "sqlalchemy>=2.0.0",
  "pydantic>=2.6.0",
  "pyyaml>=6.0.1",
  "watchdog>=4.0.0",
  "gitpython>=3.1.40",
  "requests>=2.31.0",
  "google-genai>=0.1.1",
  "openai>=1.14.0",
  "anthropic>=0.20.0",
  "psutil>=5.9.0",
  "python-dateutil>=2.8.2",
  "tzdata>=2024.1; sys_platform == 'win32'",
  "apscheduler>=3.10.4",
  "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
# 知識庫（DeskRAG）：索引、檢索與文件解析。主服務程序不 import 這些套件（ADR-009），
# 沒裝時儀表板與 API 會明說缺什麼（rag/availability.py），其餘功能照常。
# 安裝：pip install "omnicontext[rag]"（或 -e ".[rag]"）
rag = [
  "chromadb>=0.4.24",
  "fastembed>=0.2.7",
  "rank-bm25>=0.2.2",
  "jieba>=0.42.1",
  "pymupdf>=1.24.0",
  "python-docx>=1.1.0",
  "python-pptx>=0.6.23",
  "openpyxl>=3.1.2",
]
# 圖片 OCR（rag/parsers/image_parser.py）。未安裝時圖片只留檔名 stub，不影響其他解析器。
ocr = ["rapidocr-onnxruntime>=1.3.0"]
# 只跑測試（不含 rag）：CI 用它證明核心在沒有知識庫依賴時也全綠。
test = [
  "pytest>=8.0",
  "httpx>=0.27",
  "tomli>=2.0; python_version < '3.11'",
]
# 開發：核心 + 知識庫 + 測試工具。
dev = [
  "omnicontext[rag]",
  "omnicontext[test]",
]

[project.scripts]
omnicontext = "main:main"
omni = "main:main"

[tool.setuptools]
py-modules = ["main"]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "core.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "exporters*", "integrations*", "notifiers*", "rag*", "scripts*", "synthesizer*", "watchers*", "web*"]

[tool.setuptools.package-data]
web = ["*.html", "*.css", "*.js", "vendor/*.js", "js/*.js", "js/core/*.js", "js/tabs/*.js", "i18n/*.json"]
watchers = [
  "browser_extension/*.html",
  "browser_extension/*.js",
  "browser_extension/*.json",
  "browser_extension/content_scripts/*.js",
]

[tool.setuptools.data-files]
"share/omnicontext" = ["config.example.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
