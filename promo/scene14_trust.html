<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>Scene14 戲劇景 收據</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#070d17}
body{font-family:"Noto Sans CJK TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:#e8eef7;position:relative}
.bg{position:absolute;inset:0;background:
 radial-gradient(1200px 800px at 50% 30%,rgba(45,212,191,.12),transparent 62%),
 linear-gradient(160deg,#0a1420 0%,#05080f 58%,#030509 100%)}
.aur{position:absolute;width:1500px;height:1500px;border-radius:50%;filter:blur(90px);opacity:.45;mix-blend-mode:screen}
.aur.a{background:radial-gradient(circle,rgba(45,212,191,.3),transparent 62%);left:-460px;top:-560px;animation:drift1 22s ease-in-out infinite alternate}
.aur.b{background:radial-gradient(circle,rgba(139,92,246,.26),transparent 62%);right:-520px;bottom:-620px;animation:drift2 26s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(150px,90px) scale(1.12)}}
@keyframes drift2{to{transform:translate(-130px,-80px) scale(1.08)}}
.vig{position:absolute;inset:0;background:radial-gradient(1600px 1000px at 50% 46%,transparent 52%,rgba(0,0,0,.62) 100%);pointer-events:none}
.stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
 --dur:9s;animation:cam var(--dur) ease-in-out both}
@keyframes cam{from{transform:scale(1)}to{transform:scale(1.07)}}
.kicker{font-size:30px;font-weight:700;letter-spacing:.6em;text-indent:.6em;color:#2dd4bf;text-transform:uppercase}
.in{opacity:0;animation:rise 1s cubic-bezier(.16,1,.3,1) both;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(56px)}to{opacity:1;transform:none}}
/* 本景 */
.beat1{font-size:92px;font-weight:900;color:rgba(232,238,247,.92);letter-spacing:.06em}
.beat2wrap{margin-top:18px;animation:shake .5s ease 2.35s}
.beat2{font-size:168px;font-weight:900;letter-spacing:.04em;opacity:0;
 background:linear-gradient(100deg,#f4f8ff 15%,#7ff0df 50%,#c4b5fd 85%);-webkit-background-clip:text;background-clip:text;color:transparent;
 animation:slam .55s cubic-bezier(.2,1.3,.3,1) 1.9s both,bigglow 2.6s ease-in-out 2.6s infinite}
@keyframes slam{from{opacity:0;transform:scale(1.9)}to{opacity:1;transform:scale(1)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-7px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
@keyframes bigglow{0%,100%{filter:drop-shadow(0 0 24px rgba(45,212,191,.3))}50%{filter:drop-shadow(0 0 64px rgba(45,212,191,.6))}}
.rec{display:flex;gap:24px;margin-top:74px}
.rc{padding:16px 30px;border-radius:12px;font-size:26px;font-weight:700;white-space:nowrap;
 font-family:"JetBrains Mono","Consolas",monospace;color:#9be8db;
 background:rgba(15,26,40,.9);border:1.5px solid rgba(45,212,191,.35);opacity:0;
 animation:rise .8s cubic-bezier(.16,1,.3,1) var(--d) both}
</style></head>
<body>
<div class="bg"></div><div class="aur a"></div><div class="aur b"></div>
<canvas id="fx" style="position:absolute;inset:0;z-index:1;pointer-events:none"></canvas>
<script>
const cv=document.getElementById('fx');cv.width=1920;cv.height=1080;const cx=cv.getContext('2d');
const P=[];for(let i=0;i<80;i++){P.push({x:Math.random()*1920,y:Math.random()*1080,
 r:.8+Math.random()*2.6,s:.12+Math.random()*.5,o:.12+Math.random()*.4,
 hue:Math.random()<.6?'45,212,191':'167,139,250',ph:Math.random()*6.28});}
function draw(){const t=performance.now()/1000;cx.clearRect(0,0,1920,1080);
 for(const p of P){const y=(p.y-t*38*p.s)%1080,yy=y<0?y+1080:y;
  const x=p.x+Math.sin(t*.5+p.ph)*26;const tw=.55+.45*Math.sin(t*1.7+p.ph*3);
  cx.beginPath();cx.arc(x,yy,p.r,0,6.283);
  cx.fillStyle=`rgba(${p.hue},${(p.o*tw).toFixed(3)})`;cx.fill();}
 requestAnimationFrame(draw);}
requestAnimationFrame(draw);
</script>
<div class="stage" style="--dur:9s;z-index:2">
 <div class="kicker in" style="--d:.3s">EVIDENCE-FIRST</div>
 <div class="beat1 in" style="--d:.7s;margin-top:34px">每一個聲明</div>
 <div class="beat2wrap"><div class="beat2">都有收據</div></div>
 <div class="rec">
  <span class="rc" style="--d:3.2s">sha256:f2a54bed…</span>
  <span class="rc" style="--d:3.4s">verification:857027de</span>
  <span class="rc" style="--d:3.6s">audit receipt #17</span>
  <span class="rc" style="--d:3.8s">coverage 96.4%</span>
 </div>
</div>
<div class="vig" style="z-index:3"></div>
</body></html>
