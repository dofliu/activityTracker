<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>Scene02 痛點</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#070d17}
body{font-family:"Noto Sans CJK TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:#e8eef7;position:relative}
.bg{position:absolute;inset:0;background:
 radial-gradient(1200px 800px at 24% 18%,rgba(45,212,191,.14),transparent 62%),
 radial-gradient(1100px 760px at 78% 82%,rgba(139,92,246,.15),transparent 60%),
 linear-gradient(160deg,#0d1b2e 0%,#070d17 58%,#05070d 100%)}
.aur{position:absolute;width:1500px;height:1500px;border-radius:50%;filter:blur(90px);opacity:.5;mix-blend-mode:screen}
.aur.a{background:radial-gradient(circle,rgba(45,212,191,.32),transparent 62%);left:-460px;top:-560px;animation:drift1 22s ease-in-out infinite alternate}
.aur.b{background:radial-gradient(circle,rgba(139,92,246,.30),transparent 62%);right:-520px;bottom:-620px;animation:drift2 26s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(150px,90px) scale(1.12)}}
@keyframes drift2{to{transform:translate(-130px,-80px) scale(1.08)}}
.vig{position:absolute;inset:0;background:radial-gradient(1600px 1000px at 50% 46%,transparent 58%,rgba(0,0,0,.5) 100%);pointer-events:none}
.grid{position:absolute;inset:0;opacity:.05;background-image:linear-gradient(rgba(232,238,247,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(232,238,247,.5) 1px,transparent 1px);background-size:64px 64px}
.stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
 --dur:9s;animation:cam var(--dur) ease-in-out both}
@keyframes cam{from{transform:scale(1)}to{transform:scale(1.055)}}
.h1{font-size:64px;font-weight:900;line-height:1.2;text-align:center;
 background:linear-gradient(100deg,#f4f8ff 20%,#9be8db 50%,#c4b5fd 80%);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:linear-gradient(165deg,rgba(24,38,62,.92),rgba(12,20,36,.94));border:1.5px solid rgba(150,200,255,.20);
 border-radius:26px;box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08)}
.in{opacity:0;animation:rise 1s cubic-bezier(.16,1,.3,1) both;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(56px)}to{opacity:1;transform:none}}
.pop{opacity:0;animation:pop .8s cubic-bezier(.2,1.4,.35,1) both;animation-delay:var(--d,0s)}
@keyframes pop{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
/* 本景 */
.cols{display:flex;gap:56px;margin-top:52px}
.pcard{width:700px;height:520px;padding:36px 40px;position:relative}
.ptitle{font-size:34px;font-weight:900;color:#fca5a5;letter-spacing:.2em}
.pdesc{font-size:24px;color:rgba(232,238,247,.55);margin-top:8px}
.wchip{position:absolute;padding:14px 26px;border-radius:14px;font-size:26px;font-weight:700;white-space:nowrap;
 background:rgba(20,32,52,.9);border:1.5px solid rgba(150,200,255,.25);box-shadow:0 10px 26px rgba(0,0,0,.4)}
.bub{border-radius:18px;padding:20px 28px;font-size:27px;line-height:1.5;max-width:540px}
.bub.user{background:rgba(45,212,191,.16);border:1.5px solid rgba(45,212,191,.4);align-self:flex-end}
.bub.ai{background:rgba(20,32,52,.9);border:1.5px solid rgba(150,200,255,.25);align-self:flex-start}
.chatcol{display:flex;flex-direction:column;gap:22px;margin-top:34px}
</style></head>
<body>
<div class="bg"></div><div class="aur a"></div><div class="aur b"></div><div class="grid"></div>
<div class="stage" style="--dur:9s;z-index:2">
 <div class="h1 in" style="--d:.15s">工具越多,脈絡越碎</div>
 <div class="cols">
  <div class="card pcard in" style="--d:.5s">
   <div class="ptitle">散 落</div>
   <div class="pdesc">十個視窗,各記各的</div>
   <div style="position:absolute;left:56px;top:170px;transform:rotate(-6deg)"><div class="wchip pop" style="--d:.9s;position:static">💻 VS Code</div></div>
   <div style="position:absolute;right:70px;top:150px;transform:rotate(4deg)"><div class="wchip pop" style="--d:1.05s;position:static">🌐 Chrome ×27 分頁</div></div>
   <div style="position:absolute;left:120px;top:280px;transform:rotate(3deg)"><div class="wchip pop" style="--d:1.2s;position:static">🤖 Claude Code</div></div>
   <div style="position:absolute;right:56px;top:288px;transform:rotate(-4deg)"><div class="wchip pop" style="--d:1.35s;position:static">⌨️ Terminal</div></div>
   <div style="position:absolute;left:80px;top:392px;transform:rotate(-2deg)"><div class="wchip pop" style="--d:1.5s;position:static">📄 論文 v7_final.docx</div></div>
   <div style="position:absolute;right:110px;top:400px;transform:rotate(5deg)"><div class="wchip pop" style="--d:1.65s;position:static">💬 ChatGPT</div></div>
  </div>
  <div class="card pcard in" style="--d:.7s">
   <div class="ptitle">失 憶</div>
   <div class="pdesc">每開一個新對話,AI 就歸零</div>
   <div class="chatcol">
    <div class="bub user pop" style="--d:1.6s">接續昨天的進度,繼續改第五章</div>
    <div class="bub ai pop" style="--d:2.2s">請問昨天我們做到哪裡了?<br>方便再貼一次相關內容嗎…?</div>
    <div class="bub user pop" style="--d:3.0s">……(又要從頭講一遍)</div>
   </div>
  </div>
 </div>
</div>
<div class="vig" style="z-index:3"></div>
</body></html>
