<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>Scene10 小秘書</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#120d06}
body{font-family:"Noto Sans CJK TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:#f2ecdf;position:relative}
.bg{position:absolute;inset:0;background:
 radial-gradient(1200px 800px at 24% 18%,rgba(251,191,36,.14),transparent 62%),
 radial-gradient(1100px 760px at 78% 82%,rgba(249,115,22,.12),transparent 60%),
 linear-gradient(160deg,#241708 0%,#120d06 58%,#0a0704 100%)}
.aur{position:absolute;width:1500px;height:1500px;border-radius:50%;filter:blur(90px);opacity:.5;mix-blend-mode:screen}
.aur.a{background:radial-gradient(circle,rgba(251,191,36,.26),transparent 62%);left:-460px;top:-560px;animation:drift1 22s ease-in-out infinite alternate}
.aur.b{background:radial-gradient(circle,rgba(249,115,22,.22),transparent 62%);right:-520px;bottom:-620px;animation:drift2 26s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(150px,90px) scale(1.12)}}
@keyframes drift2{to{transform:translate(-130px,-80px) scale(1.08)}}
.vig{position:absolute;inset:0;background:radial-gradient(1600px 1000px at 50% 46%,transparent 58%,rgba(0,0,0,.5) 100%);pointer-events:none}
.grid{position:absolute;inset:0;opacity:.05;background-image:linear-gradient(rgba(242,236,223,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(242,236,223,.5) 1px,transparent 1px);background-size:64px 64px}
.stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
 --dur:11s;animation:cam var(--dur) ease-in-out both}
@keyframes cam{from{transform:scale(1)}to{transform:scale(1.055)}}
.kicker{font-size:28px;font-weight:700;letter-spacing:.55em;text-indent:.55em;color:#fbbf24;text-transform:uppercase}
.h1{font-size:60px;font-weight:900;text-align:center;
 background:linear-gradient(100deg,#fff8ec 20%,#fcd34d 55%,#fdba74 85%);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:linear-gradient(165deg,rgba(46,32,14,.92),rgba(24,16,8,.94));border:1.5px solid rgba(251,191,36,.24);
 border-radius:26px;box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07)}
.in{opacity:0;animation:rise 1s cubic-bezier(.16,1,.3,1) both;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(56px)}to{opacity:1;transform:none}}
.pop{opacity:0;animation:pop .8s cubic-bezier(.2,1.4,.35,1) both;animation-delay:var(--d,0s)}
@keyframes pop{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
/* 本景 */
.askrow{width:1200px;margin-top:44px;display:flex;gap:20px;align-items:center;padding:22px 30px;border-radius:22px;
 background:rgba(30,21,9,.92);border:1.5px solid rgba(251,191,36,.35)}
.askrow .ph{flex:1;font-size:31px;color:rgba(242,236,223,.6)}
.send{padding:16px 34px;border-radius:14px;font-size:30px;font-weight:900;white-space:nowrap;
 background:linear-gradient(120deg,#f59e0b,#f97316);color:#1a1005}
.sugg{width:1200px;margin-top:28px;padding:34px 44px}
.shead{display:flex;align-items:center;gap:20px}
.stitle{font-family:"JetBrains Mono","Consolas",monospace;font-size:26px;letter-spacing:.24em;color:#fcd34d;font-weight:700}
.sbadge{margin-left:auto;padding:8px 20px;border-radius:10px;font-size:23px;font-weight:800;white-space:nowrap;
 background:rgba(251,191,36,.14);border:1.5px solid rgba(251,191,36,.5);color:#fde68a}
.item{margin-top:26px;padding:26px 30px;border-radius:18px;background:rgba(20,14,6,.9);border:1.5px solid rgba(251,191,36,.18)}
.itop{display:flex;gap:18px;align-items:center}
.prio{padding:6px 16px;border-radius:8px;font-size:22px;font-weight:900;white-space:nowrap;background:rgba(239,68,68,.18);border:1px solid rgba(239,68,68,.5);color:#fca5a5}
.ititle{font-size:32px;font-weight:800}
.evi{display:inline-block;margin-top:16px;padding:8px 18px;border-radius:8px;font-size:22px;white-space:nowrap;
 font-family:"JetBrains Mono","Consolas",monospace;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);color:#fde68a}
.bound{font-size:24px;color:rgba(242,236,223,.55);margin-top:24px}
</style></head>
<body>
<div class="bg"></div><div class="aur a"></div><div class="aur b"></div><div class="grid"></div>
<div class="stage" style="--dur:11s;z-index:2">
 <div class="kicker in" style="--d:.15s">PROACTIVE SECRETARY</div>
 <div class="h1 in" style="--d:.4s;margin-top:20px">小秘書,住在儀表板第一頁</div>
 <div class="askrow in" style="--d:1.0s">
  <span style="font-size:34px">🤖</span>
  <span class="ph">請小秘書查資料、寫摘要、建議下一步…(整合本機知識庫)</span>
  <span class="send pop" style="--d:1.5s">交辦 ⚡</span>
 </div>
 <div class="card sugg in" style="--d:1.9s">
  <div class="shead">
   <span class="stitle">SECRETARY SUGGESTIONS</span>
   <span class="sbadge pop" style="--d:2.5s">PROPOSAL ONLY</span>
  </div>
  <div class="item in" style="--d:2.7s">
   <div class="itop"><span class="prio">HIGH</span><span class="ititle">驗證 Browser Extension 即時連線</span></div>
   <div class="evi">⌗ evidence: extension_status:live</div>
  </div>
  <div class="bound in" style="--d:3.5s">每條建議都附證據、可回查——預設只建議,不執行。</div>
 </div>
</div>
<div class="vig" style="z-index:3"></div>
</body></html>
