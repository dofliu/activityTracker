<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>Scene12 三道門執行器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#120d06}
body{font-family:"Noto Sans CJK TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:#f2ecdf;position:relative}
.bg{position:absolute;inset:0;background:
 radial-gradient(1200px 800px at 24% 18%,rgba(251,191,36,.14),transparent 62%),
 radial-gradient(1100px 760px at 78% 82%,rgba(45,212,191,.10),transparent 60%),
 linear-gradient(160deg,#241708 0%,#120d06 58%,#0a0704 100%)}
.aur{position:absolute;width:1500px;height:1500px;border-radius:50%;filter:blur(90px);opacity:.5;mix-blend-mode:screen}
.aur.a{background:radial-gradient(circle,rgba(251,191,36,.26),transparent 62%);left:-460px;top:-560px;animation:drift1 22s ease-in-out infinite alternate}
.aur.b{background:radial-gradient(circle,rgba(45,212,191,.2),transparent 62%);right:-520px;bottom:-620px;animation:drift2 26s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(150px,90px) scale(1.12)}}
@keyframes drift2{to{transform:translate(-130px,-80px) scale(1.08)}}
.vig{position:absolute;inset:0;background:radial-gradient(1600px 1000px at 50% 46%,transparent 58%,rgba(0,0,0,.5) 100%);pointer-events:none}
.grid{position:absolute;inset:0;opacity:.05;background-image:linear-gradient(rgba(242,236,223,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(242,236,223,.5) 1px,transparent 1px);background-size:64px 64px}
.stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
 --dur:11s;animation:cam var(--dur) ease-in-out both}
@keyframes cam{from{transform:scale(1)}to{transform:scale(1.055)}}
.kicker{font-size:26px;font-weight:700;letter-spacing:.5em;text-indent:.5em;color:#fbbf24;text-transform:uppercase}
.h1{font-size:62px;font-weight:900;text-align:center;
 background:linear-gradient(100deg,#fff8ec 20%,#fcd34d 55%,#fdba74 85%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:32px;color:rgba(242,236,223,.75);text-align:center}
.in{opacity:0;animation:rise 1s cubic-bezier(.16,1,.3,1) both;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(56px)}to{opacity:1;transform:none}}
.pop{opacity:0;animation:pop .8s cubic-bezier(.2,1.4,.35,1) both;animation-delay:var(--d,0s)}
@keyframes pop{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
/* 本景 */
.gates{display:flex;align-items:center;gap:30px;margin-top:56px}
.gate{width:400px;padding:36px 30px;border-radius:22px;text-align:center;
 background:linear-gradient(165deg,rgba(46,32,14,.92),rgba(24,16,8,.94));border:2px solid rgba(251,191,36,.2);
 box-shadow:0 24px 60px rgba(0,0,0,.5)}
.gate.lit{animation:pop .8s cubic-bezier(.2,1.4,.35,1) var(--d,0s) both,litglow 2.4s ease-in-out calc(var(--d,0s) + .8s) infinite}
@keyframes litglow{0%,100%{border-color:rgba(251,191,36,.35);box-shadow:0 24px 60px rgba(0,0,0,.5)}
 50%{border-color:rgba(251,191,36,.85);box-shadow:0 24px 70px rgba(251,191,36,.18)}}
.gate .ico{font-size:58px}
.gate .name{font-size:33px;font-weight:900;margin-top:14px;white-space:nowrap}
.gate .desc{font-size:24px;color:rgba(242,236,223,.65);margin-top:10px;white-space:nowrap}
.digits{display:flex;gap:8px;justify-content:center;margin-top:12px}
.dg{width:44px;height:56px;border-radius:8px;display:flex;align-items:center;justify-content:center;
 font-family:"JetBrains Mono","Consolas",monospace;font-size:34px;font-weight:800;color:#fde68a;
 background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.4)}
.plus{font-size:44px;color:rgba(242,236,223,.55)}
.tiers{display:flex;gap:24px;margin-top:54px}
.tier{padding:14px 30px;border-radius:12px;font-size:27px;font-weight:800;white-space:nowrap;
 background:rgba(30,21,9,.9);border:1.5px solid rgba(251,191,36,.28)}
.tier b{color:#fcd34d}
</style></head>
<body>
<div class="bg"></div><div class="aur a"></div><div class="aur b"></div><div class="grid"></div>
<div class="stage" style="--dur:11s;z-index:2">
 <div class="kicker in" style="--d:.15s">GATED EXECUTOR · ADR-008</div>
 <div class="h1 in" style="--d:.4s;margin-top:20px">要代辦?先過三道門</div>
 <div class="gates">
  <div class="gate lit" style="--d:1.1s">
   <div class="ico">🔑</div><div class="name">Execution Token</div><div class="desc">獨立憑證,缺了一律 401</div>
  </div>
  <div class="plus in" style="--d:1.6s">+</div>
  <div class="gate lit" style="--d:1.9s">
   <div class="ico">👆</div><div class="name">逐項批准</div><div class="desc">每一件事,單獨點頭</div>
  </div>
  <div class="plus in" style="--d:2.4s">+</div>
  <div class="gate lit" style="--d:2.7s">
   <div class="ico">🔢</div><div class="name">一次性確認碼</div>
   <div class="digits">
    <span class="dg pop" style="--d:3.3s">8</span><span class="dg pop" style="--d:3.42s">8</span><span class="dg pop" style="--d:3.54s">4</span>
    <span class="dg pop" style="--d:3.66s">2</span><span class="dg pop" style="--d:3.78s">1</span><span class="dg pop" style="--d:3.9s">0</span>
   </div>
   <div class="desc" style="margin-top:12px">5 分鐘失效 · 錯一次作廢</div>
  </div>
 </div>
 <div class="tiers in" style="--d:4.5s">
  <span class="tier"><b>L0</b> 唯讀 · 可自動</span>
  <span class="tier"><b>L1</b> 可逆 · 單鍵批准</span>
  <span class="tier"><b>L2</b> 變更 · 三道門＋冷卻</span>
 </div>
 <div class="sub in" style="--d:5.2s;margin-top:40px">預設全部關閉——每一道,都由你親手打開</div>
</div>
<div class="vig" style="z-index:3"></div>
</body></html>
