<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>Scene07 Context Handoff</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#070d17}
body{font-family:"Noto Sans CJK TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:#e8eef7;position:relative}
.bg{position:absolute;inset:0;background:
 radial-gradient(1200px 800px at 24% 18%,rgba(56,189,248,.15),transparent 62%),
 radial-gradient(1100px 760px at 78% 82%,rgba(45,212,191,.13),transparent 60%),
 linear-gradient(160deg,#0d1b2e 0%,#070d17 58%,#05070d 100%)}
.aur{position:absolute;width:1500px;height:1500px;border-radius:50%;filter:blur(90px);opacity:.5;mix-blend-mode:screen}
.aur.a{background:radial-gradient(circle,rgba(56,189,248,.30),transparent 62%);left:-460px;top:-560px;animation:drift1 22s ease-in-out infinite alternate}
.aur.b{background:radial-gradient(circle,rgba(45,212,191,.28),transparent 62%);right:-520px;bottom:-620px;animation:drift2 26s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(150px,90px) scale(1.12)}}
@keyframes drift2{to{transform:translate(-130px,-80px) scale(1.08)}}
.vig{position:absolute;inset:0;background:radial-gradient(1600px 1000px at 50% 46%,transparent 58%,rgba(0,0,0,.5) 100%);pointer-events:none}
.grid{position:absolute;inset:0;opacity:.05;background-image:linear-gradient(rgba(232,238,247,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(232,238,247,.5) 1px,transparent 1px);background-size:64px 64px}
.stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
 --dur:10s;animation:cam var(--dur) ease-in-out both}
@keyframes cam{from{transform:scale(1)}to{transform:scale(1.055)}}
.h1{font-size:58px;font-weight:900;text-align:center;
 background:linear-gradient(100deg,#f4f8ff 20%,#9be8db 50%,#c4b5fd 80%);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:linear-gradient(165deg,rgba(24,38,62,.92),rgba(12,20,36,.94));border:1.5px solid rgba(150,200,255,.20);
 border-radius:26px;box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08)}
.chip{display:inline-flex;align-items:center;gap:16px;padding:18px 34px;border-radius:999px;font-size:32px;font-weight:700;white-space:nowrap;
 background:rgba(20,32,52,.82);border:1.5px solid rgba(150,200,255,.22);box-shadow:0 14px 40px rgba(0,0,0,.45)}
.in{opacity:0;animation:rise 1s cubic-bezier(.16,1,.3,1) both;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(56px)}to{opacity:1;transform:none}}
.pop{opacity:0;animation:pop .8s cubic-bezier(.2,1.4,.35,1) both;animation-delay:var(--d,0s)}
@keyframes pop{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
/* 本景 */
.doc{width:1160px;padding:44px 56px;margin-top:44px}
.line{font-size:31px;line-height:1.9;color:rgba(232,238,247,.9)}
.line.h{font-family:"JetBrains Mono","Consolas",monospace;color:#7dd3fc;font-weight:700;font-size:33px}
.caret{display:inline-block;width:16px;height:36px;background:#2dd4bf;vertical-align:-6px;margin-left:10px;
 animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.chips{display:flex;gap:22px;margin-top:46px;align-items:center}
.mut{font-size:30px;color:rgba(232,238,247,.6)}
</style></head>
<body>
<div class="bg"></div><div class="aur a"></div><div class="aur b"></div><div class="grid"></div>
<div class="stage" style="--dur:10s;z-index:2">
 <div class="h1 in" style="--d:.15s">「昨天做到哪?」——十秒接上</div>
 <div class="card doc in" style="--d:.6s">
  <div class="line h in" style="--d:1.0s"># Context Handoff — AI_Papers</div>
  <div class="line in" style="--d:1.6s">▸ 進度:第五章修訂 60%,停在圖 5-3 資料來源</div>
  <div class="line in" style="--d:2.2s">▸ 未結:審稿意見 2 則待回覆(已 2 天)</div>
  <div class="line in" style="--d:2.8s">▸ 下一步:重跑實驗 B,補齊圖表數據<span class="caret"></span></div>
 </div>
 <div class="chips">
  <span class="chip pop" style="--d:3.6s">📋 一鍵複製</span>
  <span class="mut in" style="--d:3.9s">→ 貼進</span>
  <span class="chip pop" style="--d:4.1s">Claude</span>
  <span class="chip pop" style="--d:4.25s">ChatGPT</span>
  <span class="chip pop" style="--d:4.4s">Codex</span>
  <span class="mut in" style="--d:4.7s">任何新對話,無縫接手</span>
 </div>
</div>
<div class="vig" style="z-index:3"></div>
</body></html>
