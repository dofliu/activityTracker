name: Platform Matrix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build-install:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install test and build dependencies
        run: python -m pip install --upgrade pip build ".[dev]"

      - name: Run contract and integration tests
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q core exporters integrations notifiers scripts synthesizer watchers web main.py

      - name: Validate Browser Extension JavaScript syntax
        shell: pwsh
        run: |
          Get-ChildItem watchers/browser_extension -Recurse -Filter *.js |
            ForEach-Object { node --check $_.FullName }

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify release artifact contents
        run: python scripts/verify_release_artifacts.py dist --receipt matrix-artifact-receipt.json

      - name: Install wheel and verify writable-home runtime
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist -Filter *.whl -File | Select-Object -First 1).FullName
          python -m pip install --force-reinstall --no-deps $wheel
          $smokeHome = Join-Path $env:RUNNER_TEMP "omnicontext-installed-smoke"
          $receipt = Join-Path $env:RUNNER_TEMP "omnicontext-installed-smoke.json"
          $env:OMNICONTEXT_HOME = $smokeHome
          Remove-Item Env:OMNICONTEXT_CONFIG -ErrorAction SilentlyContinue
          Push-Location $env:RUNNER_TEMP
          try {
            python "$env:GITHUB_WORKSPACE/scripts/verify_installed_package.py" --expect-home $smokeHome --receipt $receipt
          } finally {
            Pop-Location
          }
          Copy-Item $receipt matrix-installed-receipt.json

      - name: Upload matrix receipts
        uses: actions/upload-artifact@v4
        with:
          name: receipts-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            matrix-artifact-receipt.json
            matrix-installed-receipt.json

  # TODO D1：知識庫依賴是選用 extra。這個 job 不裝 [rag]，證明核心在沒有
  # chromadb／fastembed／rank-bm25／jieba／pymupdf／office parsers 時仍能啟動、測試全綠
  # （需要它們的測試會 importorskip，並在摘要裡數得出來）。
  test-core-without-rag-extra:
    name: ubuntu-latest / Python 3.12 / no [rag] extra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install core + test tools only
        run: python -m pip install --upgrade pip ".[test]"

      - name: Assert the RAG packages are really absent
        run: |
          python - <<'PY'
          from rag import availability
          missing = availability.missing_index_packages()
          assert set(missing) == set(availability.INDEX_PACKAGES.values()), missing
          print("rag extra absent as expected:", missing)
          PY

      - name: Main process imports without the extra
        run: python -c "import core.server; print('core.server import ok')"

      - name: Run contract tests (rag-dependent ones skip)
        run: python -m pytest -q -rs

